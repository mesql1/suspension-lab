name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout legacy ThermoSignal
        uses: actions/checkout@v4
        with:
          ref: c0ddcb6c7f443b314070a7834aa88ad6844998e4
          path: .legacy-source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            .legacy-source/package-lock.json

      - name: Install current dependencies
        run: npm ci

      - name: Build current application
        run: npm run build

      - name: Validate SI engine
        run: npm run test:si --workspace web

      - name: Install legacy dependencies
        working-directory: .legacy-source
        run: npm ci

      - name: Build legacy ThermoSignal
        working-directory: .legacy-source
        run: npm run build

      - name: Add legacy application to Pages artifact
        run: |
          mkdir -p web/dist/legacy
          cp -R .legacy-source/web/dist/. web/dist/legacy/
          touch web/dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
